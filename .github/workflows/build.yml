
name: Build MiniBoss Timer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: "miniboss-timer 3.0"
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: miniboss-timer-jar
          path: "miniboss-timer 3.0/build/libs/*.jar"
          if-no-files-found: error
